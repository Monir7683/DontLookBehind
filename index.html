<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  overflow: hidden;
}

#normal {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  color: #333;
}

#scare {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  z-index: 10;
}

#ghostImage {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: ghostAppear .18s ease-out;
}

#replay {
  display: none;
  position: fixed;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  background: black;
  color: white;
  border: 1px solid white;
  padding: 14px 30px;
  font-size: 17px;
  cursor: pointer;
}

@keyframes ghostAppear {
  from {
    transform: scale(.2);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.flash {
  animation: flash .12s 3;
}

@keyframes flash {
  50% { background: white; }
}
</style>
</head>

<body>

<div id="normal">
  <h1>Welcome!</h1>
  <p>Hope you're having a good day.</p>
  <p>Thanks for visiting.</p>
</div>

<div id="scare">
  <img id="ghostImage" src="ghost.jpg" alt="">

</div>

<button id="replay" onclick="restart()">Try again</button>

<script>
let triggered = false;
let timer;
let audioContext;

function makeScream() {
  const scream = new Audio("scream.mp3");
  scream.volume = 100;
  scream.play().catch(error => {
    console.log("Audio playback failed:", error);
  });
}

function jumpscare() {
  if (triggered) return;

  triggered = true;
  clearTimeout(timer);

  document.getElementById("normal").style.display = "none";

  const scare = document.getElementById("scare");
  scare.style.display = "block";

  scare.classList.remove("flash");
  void scare.offsetWidth;
  scare.classList.add("flash");

  document.getElementById("replay").style.display = "none";

  makeScream();

  setTimeout(() => {
    document.getElementById("replay").style.display = "block";
  }, 2500);
}

function restart() {
  triggered = false;

  document.getElementById("scare").style.display = "none";
  document.getElementById("replay").style.display = "none";
  document.getElementById("normal").style.display = "flex";

  timer = setTimeout(jumpscare, 4000);
}

// Surprise after four seconds
timer = setTimeout(jumpscare, 4000);

// Clicking anywhere triggers it immediately
document.addEventListener("click", () => {
  if (!triggered) jumpscare();
});
</script>

</body>
</html>
